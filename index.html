<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Redding | Author and Illustrator</title>
  <meta name="description" content="Dan Redding is a children's book author and illustrator. Browse his illustration portfolio, featuring original children's book artwork and character illustrations.">
  <meta name="robots" content="index, follow, noai, noimageai">
  <link rel="canonical" href="https://danredding.com/">
  <link rel="icon" type="image/png" href="uploads/favicon.png">
  <link rel="icon" type="image/svg+xml" href="uploads/logo.svg">
  <meta property="og:title" content="Dan Redding | Author and Illustrator">
  <meta property="og:description" content="Children's book illustration and character work by author-illustrator Dan Redding.">
  <meta property="og:url" content="https://danredding.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://danredding.com/uploads/milo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="index.html" aria-label="Dan Redding, home"><img src="uploads/logo.svg" alt="Dan Redding" width="72" height="72"></a>
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav" aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a class="btn" href="mailto:danredding@gmail.com">Contact</a>
      </nav>
    </header>

    <main>
      <h1 class="page-title">The world of author-illustrator Dan Redding</h1>

      <div class="pills" role="tablist" aria-label="Portfolio category">
        <button class="pill" role="tab" id="tab-childrens" aria-controls="panel-childrens" aria-selected="true">Children’s</button>
        <button class="pill" role="tab" id="tab-portraits" aria-controls="panel-portraits" aria-selected="false" tabindex="-1">Portraits</button>
      </div>

      <section class="gallery" id="panel-childrens" role="tabpanel" aria-labelledby="tab-childrens">
        <div class="row">
          <button class="tile wide" data-full="uploads/milo.jpg"><img src="uploads/milo.jpg" alt="Children's book spread by Dan Redding of a fluffy white creature playing checkers with a purple walrus" width="2000" height="999"><span class="cap">Children's Book Spread</span></button>
          <button class="tile" data-full="uploads/Magician.jpg"><img src="uploads/Magician.jpg" alt="Illustration by Dan Redding of a vampire magician pulling bats out of a top hat" width="1800" height="1800" loading="lazy"><span class="cap">Abracadabra!</span></button>
        </div>
        <div class="row flip">
          <button class="tile" data-full="uploads/witch.jpg"><img src="uploads/witch.jpg" alt="Illustration by Dan Redding of a grinning green witch in a pointed hat" width="1363" height="1363" loading="lazy"><span class="cap">Witch</span></button>
          <button class="tile wide" data-full="uploads/Character.jpg"><img src="uploads/Character.jpg" alt="Character study by Dan Redding of a girl with pigtails in three expressions" width="1500" height="921" loading="lazy"><span class="cap">Character Study</span></button>
        </div>
        <div class="row">
          <button class="tile wide" data-full="uploads/desk.jpg"><img src="uploads/desk.jpg" alt="Children's book illustration by Dan Redding of a boy daydreaming about wizards at his school desk" width="1500" height="1336" loading="lazy" style="object-position:50% 30%"><span class="cap">Children's Book Project</span></button>
          <button class="tile" data-full="uploads/dracula.jpg"><img src="uploads/dracula.jpg" alt="Illustration by Dan Redding of Dracula driving an ice cream truck at night" width="1400" height="1134" loading="lazy"><span class="cap">Ice Scream</span></button>
        </div>
      </section>

      <section class="gallery portraits" id="panel-portraits" role="tabpanel" aria-labelledby="tab-portraits" hidden>
        <div class="prow">
          <button class="tile" data-full="uploads/beastie-boys.jpg" style="--ar:1.849"><img src="uploads/beastie-boys.jpg" alt="Portrait illustration by Dan Redding of the Beastie Boys in front of a teal brick wall" width="1640" height="887" loading="lazy"><span class="cap">Beastie Boys</span></button>
          <button class="tile" data-full="uploads/kool-moe-dee.jpg" style="--ar:1.296"><img src="uploads/kool-moe-dee.jpg" alt="Portrait illustration by Dan Redding of Kool Moe Dee in a white cap and dark sunglasses" width="1458" height="1125" loading="lazy"><span class="cap">Kool Moe Dee</span></button>
        </div>
        <div class="prow">
          <button class="tile" data-full="uploads/metallica-dan-redding.jpg" style="--ar:1.500"><img src="uploads/metallica-dan-redding.jpg" alt="Illustration by Dan Redding of Metallica's singer and guitarist performing" width="1200" height="800" loading="lazy"><span class="cap">Metallica</span></button>
          <button class="tile" data-full="uploads/men-i-trust.jpg" style="--ar:1.614"><img src="uploads/men-i-trust.jpg" alt="Portrait illustration by Dan Redding of the band Men I Trust against a blue background" width="1440" height="892" loading="lazy"><span class="cap">Men I Trust</span></button>
        </div>
        <div class="prow">
          <button class="tile" data-full="uploads/nirvana.jpg" style="--ar:1.478"><img src="uploads/nirvana.jpg" alt="Portrait illustration by Dan Redding of the three members of Nirvana" width="1596" height="1080" loading="lazy"><span class="cap">Nirvana</span></button>
          <button class="tile" data-full="uploads/sex-pistols.jpg" style="--ar:1.613"><img src="uploads/sex-pistols.jpg" alt="Illustration by Dan Redding of the Sex Pistols performing in front of a newspaper headline" width="1500" height="930" loading="lazy"><span class="cap">Johnny and Steve</span></button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Dan Redding. All artwork, illustrations, and text are protected by copyright. All rights reserved.</span>
      <a href="mailto:danredding@gmail.com">danredding@gmail.com</a>
    </footer>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <button class="lb-btn lb-close" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-btn lb-next" aria-label="Next">›</button>
  </div>

  <script src="site.js"></script>
</body>
</html>
