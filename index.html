<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dan Redding | Author and Illustrator</title>
  <meta name="description" content="Dan Redding is a children's book author and illustrator. Browse his illustration portfolio, featuring original children's book artwork and character illustrations.">
  <meta name="robots" content="index, follow, noai, noimageai">
  <link rel="canonical" href="https://danredding.com/">
  <link rel="icon" type="image/png" href="uploads/favicon.png">
  <link rel="icon" type="image/svg+xml" href="uploads/logo.svg">
  <meta property="og:title" content="Dan Redding | Author and Illustrator">
  <meta property="og:description" content="Children's book illustration and character work by author-illustrator Dan Redding.">
  <meta property="og:url" content="https://danredding.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://danredding.com/uploads/milo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="logo" href="index.html" aria-label="Dan Redding, home"><img src="uploads/logo.svg" alt="Dan Redding" width="72" height="72"></a>
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav" aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a class="btn" href="mailto:danredding@gmail.com">Contact</a>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Work by author-illustrator Dan Redding</h1>

      <section class="gallery" aria-label="Illustration portfolio">
        <div class="row">
          <button class="tile wide" data-full="uploads/milo.jpg"><img src="uploads/milo.jpg" alt="Children's book spread by Dan Redding of a fluffy white creature playing checkers with a purple walrus" width="2000" height="999"><span class="cap">Children's Book Spread</span></button>
          <button class="tile" data-full="uploads/dracula.jpg"><img src="uploads/dracula.jpg" alt="Illustration by Dan Redding of Dracula driving an ice cream truck at night" width="1400" height="1134" loading="lazy"><span class="cap">Ice Scream</span></button>
        </div>
        <div class="row flip">
          <button class="tile" data-full="uploads/witch.jpg"><img src="uploads/witch.jpg" alt="Illustration by Dan Redding of a grinning green witch in a pointed hat" width="1363" height="1363" loading="lazy"><span class="cap">Witch</span></button>
          <button class="tile wide" data-full="uploads/Character.jpg"><img src="uploads/Character.jpg" alt="Character study by Dan Redding of a girl with pigtails in three expressions" width="1500" height="921" loading="lazy"><span class="cap">Character Study</span></button>
        </div>
        <div class="row">
          <button class="tile wide" data-full="uploads/desk.jpg"><img src="uploads/desk.jpg" alt="Children's book illustration by Dan Redding of a boy daydreaming about wizards at his school desk" width="1500" height="1336" loading="lazy" style="object-position:50% 30%"><span class="cap">Children's Book Project</span></button>
          <button class="tile" data-full="uploads/wizard-dan-redding.jpg"><img src="uploads/wizard-dan-redding.jpg" alt="Children's book illustration by Dan Redding of a wizard appearing before an amazed young boy" width="1500" height="1489" loading="lazy"><span class="cap">Children's Book Project</span></button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Dan Redding. All artwork, illustrations, and text are protected by copyright. All rights reserved.</span>
      <a href="mailto:danredding@gmail.com">danredding@gmail.com</a>
    </footer>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <button class="lb-btn lb-close" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-btn lb-next" aria-label="Next">›</button>
  </div>

  <script src="site.js"></script>
</body>
</html>
